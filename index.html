<title>AI Requirements Quality Gate · RAG</title>
<!-- 법령 근거 조회 API 주소. 서버를 따로 배포하면 그 주소(https://...)로 바꾸세요. -->
<meta name="rag-endpoint" content="/api/review">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Single light theme (switched from dark on 2026-09-29: the page is a long review document —
     requirements, ER questions, tables — so light surfaces read better). Brand hues the user chose
     (accent #4880FF, Value #4AD991, Risk #FF9066, [값] #FEC53D) are kept as fills/borders; *-ink
     tokens are darker shades of the same hues for text on light backgrounds. */
  :root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-2: #f2f4f7;
    --ink: #202632;
    --ink-dim: #667085;
    --border: #dce2ea;
    --accent: #4880ff;
    --accent-ink: #2f5fd0;
    --accent-soft: #e8efff;
    --critical: #d92d20;
    --critical-soft: #fee4e2;
    --high: #b45309;
    --high-soft: #fef0dc;
    --low: #667085;
    --low-soft: #f2f4f7;
    --value: #4ad991;
    --value-ink: #0e7a4b;
    --value-soft: #ddf7ea;
    --risk: #ff9066;
    --risk-ink: #b8431a;
    --risk-soft: #ffe9df;
    --gold: #fec53d;
    --gold-ink: #7a5200;
    --gold-soft: #fff1c7;
    --radius: 18px;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    line-height: 1.6;
  }
  .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; }
  a { color: var(--accent-ink); }
  button, select, input { font-family: inherit; }

  .wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 72px; }

  /* ---- nav ---- */
  .topnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
  .brand-mark { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 13px; color: var(--ink); }
  .nav-actions { display: flex; gap: 8px; }
  .btn {
    font-size: 14.5px; border-radius: 8px; padding: 8px 14px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .92; color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; }

  /* ---- hero ---- */
  .hero { margin-bottom: 34px; }
  .eyebrow { font-size: 13.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 10px; }
  h1 { font-size: clamp(28px, 4.4vw, 40px); margin: 0 0 12px; letter-spacing: -0.01em; }
  .hero p.lede { color: var(--ink); max-width: 68ch; margin: 0 0 20px; font-size: 17px; }
  @media (min-width: 1000px) { .hero h1 { white-space: nowrap; max-width: none; } .hero p.lede { max-width: none; } }

  .flow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .flow-step {
    font-size: 14.5px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 7px 13px; white-space: nowrap;
  }
  .flow-arrow { color: var(--ink); font-size: 16px; }

  .principle {
    font-size: 15px; color: var(--ink); border-left: 3px solid var(--accent); padding: 8px 0 8px 12px;
  }
  .principle code { font-family: inherit; background: var(--surface-2); border-radius: 4px; padding: 1px 6px; font-size: 1em; color: var(--ink); }

  /* ---- case cards ---- */
  .section-title { font-size: 15.5px; font-weight: 600; margin: 0 0 4px; }
  .section-sub { font-size: 14.5px; color: var(--ink); margin: 0 0 16px; }
  .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 680px) { .card-grid { grid-template-columns: 1fr; } }

  .case-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 10px;
    transition: border-color .15s ease, transform .15s ease; box-shadow: 0 1px 3px rgba(16,24,40,.08);
    color: var(--ink); font-family: inherit;
  }
  .case-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .case-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .case-type-badge {
    display: inline-block; align-self: flex-start; font-size: 12px;
    font-weight: 600; letter-spacing: .04em; border-radius: 4px; padding: 3px 10px;
  }
  .case-type-value { background: var(--value-soft); color: var(--value-ink); }
  .case-type-risk { background: var(--risk-soft); color: var(--risk-ink); }
  .case-title { font-size: 18px; font-weight: 600; margin: 0; }
  .case-row { font-size: 14.5px; }
  .case-row .label {
    font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink); display: flex; align-items: center; gap: 5px; margin-bottom: 3px;
  }
  .case-row .val { color: var(--ink); }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 12px; background: var(--surface-2); color: var(--ink);
    border-radius: 999px; padding: 3px 9px;
  }
  .card-cta { font-size: 13.5px; color: var(--accent-ink); margin-top: 2px; }

  /* ---- priority badges ---- */
  .badge {
    font-family: 'IBM Plex Mono', monospace;
    display: inline-block; font-size: 12px; font-weight: 600;
    border-radius: 4px; padding: 2px 9px; letter-spacing: .02em; white-space: nowrap;
  }
  .badge-p0 { background: var(--critical-soft); color: var(--critical); }
  .badge-p1 { background: var(--high-soft); color: var(--high); }
  .badge-p2 { background: var(--low-soft); color: var(--low); }

  .priority-legend {
    display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 22px; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .legend-row { display: flex; gap: 9px; align-items: flex-start; flex: 1 1 220px; min-width: 200px; }
  .legend-row .legend-text b { display: block; font-size: 14.5px; margin-bottom: 2px; }
  .legend-row .legend-text span { color: var(--ink); font-size: 13.5px; }

  /* ---- detail page ---- */
  .case-header { margin-bottom: 30px; }
  .case-header h2 { font-size: 27px; margin: 6px 0 14px; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom: 14px; }
  @media (max-width: 600px) { .meta-grid { grid-template-columns: 1fr; } }
  .meta-item .label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 3px; }
  .meta-item .val { font-size: 15.5px; }
  .meta-item .val.placeholder { color: var(--ink-dim); font-style: italic; }
  .summary-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; font-size: 15.5px; margin-bottom: 6px; }

  .req-block { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-bottom: 18px; overflow: hidden; }
  .req-block > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .req-block > summary::-webkit-details-marker { display: none; }
  .req-block[open] { border-color: var(--accent); }
  .req-num { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink); }
  .req-title { font-size: 16.5px; margin-top: 3px; }
  .req-caret { color: var(--ink); flex: none; transition: transform .15s ease; }
  .req-block[open] .req-caret { transform: rotate(90deg); }
  .req-body { padding: 0 18px 20px; border-top: 1px solid var(--border); }

  .stage { padding-top: 20px; }
  .stage-num { font-size: 12.5px; color: var(--accent-ink); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; }
  .stage-note { font-size: 13px; color: var(--ink); font-style: italic; margin: 4px 0 0; }

  .virtual-req { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: 16px; }

  .subcard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .subcard-full { margin-top: 10px; }
  @media (max-width: 760px) { .subcard-grid { grid-template-columns: 1fr; } }
  .subcard { border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; }
  .subcard h4 { font-size: 13px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink); margin: 0 0 8px; }
  .subcard ul { margin: 0; padding-left: 16px; font-size: 15px; }
  .subcard li { margin-bottom: 7px; }
  .subcard li .badge { margin-right: 5px; }
  .subcard .empty { color: var(--ink); font-style: italic; font-size: 14.5px; }
  .basis { display: block; font-size: 12.5px; color: var(--ink); margin-top: 2px; }

  .before-after { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .ba-block { border-radius: 8px; padding: 12px 14px; font-size: 15.5px; }
  .ba-before { background: var(--surface-2); }
  .ba-after { background: var(--accent-soft); border: 1px solid var(--accent); }
  .ba-label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); margin-bottom: 6px; display: block; }
  .ba-arrow { text-align: center; color: var(--ink); font-size: 15px; }

  .ph { border-radius: 4px; padding: 0 3px; }
  .ph-value { font-family: 'IBM Plex Mono', monospace; background: var(--gold-soft); color: var(--gold-ink); font-size: 1em; }
  .ph-generic { font-family: 'IBM Plex Mono', monospace; background: var(--gold-soft); color: var(--gold-ink); font-size: 1em; }
  sup.ref-tag { color: var(--accent-ink); font-size: 12px; margin-left: 1px; }

  .ref-list { margin-top: 10px; font-size: 13.5px; color: var(--ink); }
  .ref-list li { margin-bottom: 5px; }
  .ref-list b { color: var(--ink); font-weight: 600; }

  .ac-list { margin: 0; padding-left: 0; list-style: none; }
  .ac-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 15px; }
  .ac-item .vm { color: var(--ink); font-size: 13.5px; margin-top: 4px; }

  /* ---- review closure (human-in-the-loop) ---- */
  .req-progress { font-size: 12.5px; color: var(--ink); background: var(--surface-2); border-radius: 999px; padding: 2px 10px; margin-left: 8px; white-space: nowrap; }
  .req-progress.done { background: var(--value-soft); color: var(--value-ink); }
  .review-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 18px;
    background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: 14.5px;
  }
  .review-bar b { font-weight: 600; }
  .review-bar .btn { margin-left: auto; padding: 4px 11px; font-size: 13px; }
  .review-note { font-size: 13.5px; color: var(--ink); margin: 0 0 10px; }

  .review-list { list-style: none; margin: 0; padding: 0; font-size: 15px; }
  .review-list li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .review-list li:last-child { border-bottom: 0; }
  .review-list li.is-excluded .item-text > span:first-child { text-decoration: line-through; opacity: .5; }
  .review-list li.is-excluded .why-line { opacity: .75; }
  .ac-item.is-excluded .item-text { text-decoration: line-through; opacity: .5; }
  .ac-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .decide { display: inline-flex; gap: 4px; flex: none; }
  .decide button {
    font-size: 12.5px; border: 1px solid var(--border); background: transparent;
    color: var(--ink); border-radius: 999px; padding: 2px 10px; cursor: pointer;
  }
  .decide button:hover { border-color: var(--accent); }
  .decide button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .decide button.d-adopt[aria-pressed="true"] { background: var(--value-soft); color: var(--value-ink); border-color: var(--value); }
  .decide button.d-exclude[aria-pressed="true"] { background: var(--critical-soft); color: var(--critical); border-color: var(--critical); }

  .er-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .er-item.st-closed { border-color: var(--value); }
  .er-item.st-out { opacity: .6; }
  .er-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; font-size: 15px; }
  .er-status {
    flex: none; font-size: 13px; border-radius: 999px; padding: 3px 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); cursor: pointer;
  }
  .er-status:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .er-status.st-open { color: var(--gold-ink); border-color: var(--gold); }
  .er-status.st-review { color: var(--accent-ink); border-color: var(--accent); }
  .er-status.st-closed { color: var(--value-ink); border-color: var(--value); }
  .er-status.st-out { color: var(--ink-dim); }
  .ph-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 6px 10px; margin-top: 9px; align-items: center; }
  @media (max-width: 600px) { .ph-fields { grid-template-columns: 1fr; } }
  .ph-fields .ph { justify-self: start; font-size: 14px; }
  .ph-input {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; padding: 6px 9px;
  }
  .ph-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .er-extra-title { font-size: 13px; color: var(--ink); margin: 14px 0 4px; }
  .ph-filled { background: var(--value-soft); color: var(--value-ink); }
  .ph-na { font-family: 'IBM Plex Mono', monospace; background: var(--surface-2); color: var(--ink-dim); }
  .ph-input:disabled { opacity: .5; cursor: not-allowed; }
  .ph-draft { background: var(--accent-soft); color: var(--accent-ink); }
  .after-state { font-size: 12px; border-radius: 999px; padding: 1px 8px; margin-left: 6px; text-transform: none; letter-spacing: 0; }
  .after-state.open { background: var(--gold-soft); color: var(--gold-ink); }
  .after-state.done { background: var(--value-soft); color: var(--value-ink); }

  /* ---- traceability ---- */
  .tr-id { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; margin-right: 6px; white-space: nowrap; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table.trace { width: 100%; border-collapse: collapse; font-size: 14.5px; min-width: 640px; }
  table.trace th { text-align: left; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 9px 12px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
  table.trace td { padding: 9px 12px; border-top: 1px solid var(--border); vertical-align: top; }
  table.trace td .cell-item { display: block; margin-bottom: 6px; }
  table.trace td .cell-item:last-child { margin-bottom: 0; }
  table.trace .is-excluded { text-decoration: line-through; opacity: .5; }
  .tr-state { font-size: 12px; border-radius: 999px; padding: 1px 8px; margin-left: 4px; border: 1px solid var(--border); white-space: nowrap; }
  .tr-state.st-open { color: var(--gold-ink); border-color: var(--gold); }
  .tr-state.st-review { color: var(--accent-ink); border-color: var(--accent); }
  .tr-state.st-closed { color: var(--value-ink); border-color: var(--value); }
  .tr-state.st-out { color: var(--ink-dim); }
  .tr-warn { color: var(--gold-ink); font-size: 14px; }
  .trace-warns { margin: 10px 0 0; padding: 10px 14px; background: var(--gold-soft); border-radius: 8px; font-size: 14px; color: var(--gold-ink); }
  .trace-warns ul { margin: 4px 0 0; padding-left: 18px; }
  .trace-ok { margin: 10px 0 0; font-size: 14px; color: var(--value-ink); }
  .matrix-link { margin-top: 4px; }
  table.matrix td.num, table.matrix th.num { text-align: center; white-space: nowrap; }
  table.matrix tr.row-link { cursor: pointer; }
  table.matrix tr.row-link:hover td { background: var(--surface-2); }
  table.matrix .m-title { font-size: 14.5px; }
  table.matrix .m-case { font-size: 13px; color: var(--ink); }

  /* ---- similar requirements ---- */
  .sim-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .sim-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sim-topic { font-weight: 600; font-size: 15.5px; }
  .sim-head .btn { padding: 4px 11px; font-size: 13px; }
  .sim-req { margin: 8px 0 6px; font-size: 14.5px; }
  .sim-pairs { margin: 0; padding-left: 0; list-style: none; font-size: 14px; }
  .sim-pairs li { padding: 5px 0; border-top: 1px solid var(--border); }
  .sim-arrow { color: var(--ink); margin-right: 6px; }
  .sim-vals { display: block; margin-top: 3px; color: var(--value-ink); font-size: 13.5px; }

  /* ---- collapsed detail section ---- */
  .more-details { margin-top: 22px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .more-details > summary { cursor: pointer; padding: 11px 14px; font-weight: 600; font-size: 15px; list-style: none; }
  .more-details > summary::-webkit-details-marker { display: none; }
  .more-details > summary::before { content: '▸'; display: inline-block; margin-right: 8px; transition: transform .15s ease; }
  .more-details[open] > summary::before { transform: rotate(90deg); }
  .more-details > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .more-hint { font-weight: 400; font-size: 13.5px; color: var(--ink-dim); margin-left: 6px; }
  .more-body { padding: 0 14px 18px; border-top: 1px solid var(--border); }

  /* ---- roadmap ---- */
  .roadmap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 760px) { .roadmap { grid-template-columns: 1fr; } }
  .roadmap-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .roadmap-col h3 { font-size: 15.5px; margin: 8px 0 8px; }
  .roadmap-col ul { margin: 0; padding-left: 18px; font-size: 14.5px; }
  .roadmap-col li { margin-bottom: 6px; }
  .stage-chip { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
  .stage-now { background: var(--value-soft); color: var(--value-ink); }
  .stage-next { background: var(--accent-soft); color: var(--accent-ink); }
  .stage-future { background: var(--surface-2); color: var(--ink); }


  /* ---- evidence basis / product classification / evaluation ---- */
  .nav-actions { flex-wrap: wrap; }
  .nav-actions .btn { padding: 6px 12px; font-size: 13.5px; }
  .nav-actions .btn.is-current { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .bchip { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 4px; padding: 1px 7px; white-space: nowrap; border: 1px solid transparent; }
  .b-S { background: var(--value-soft); color: var(--value-ink); }
  .b-I { background: var(--gold-soft); color: var(--gold-ink); }
  .b-E { background: var(--accent-soft); color: var(--accent-ink); }
  .why-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; font-size: 13px; color: var(--ink-dim); }
  .why-line b { color: var(--ink); font-weight: 600; }
  .hstate { font-size: 12px; border-radius: 999px; padding: 0 8px; border: 1px dashed var(--gold); color: var(--gold-ink); white-space: nowrap; }
  .hstate.ok { border: 1px solid var(--value); color: var(--value-ink); }
  .hstate.no { border: 1px solid var(--border); color: var(--ink-dim); }
  .basis-sum { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; margin: -2px 0 8px; color: var(--ink-dim); }
  .item-text { flex: 1 1 auto; min-width: 0; }
  .decide { flex-wrap: wrap; justify-content: flex-end; align-items: center; max-width: 46%; }
  .why-select { font-size: 12.5px; border: 1px solid var(--critical); color: var(--critical); background: var(--surface); border-radius: 999px; padding: 1px 6px; }
  .why-select.unset { border-style: dashed; }
  @media (max-width: 600px) { .review-list li, .ac-item { flex-direction: column; } .decide { max-width: none; justify-content: flex-start; } }

  .gate { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .gate.pass { border-color: var(--value); background: #f6fdf9; }
  .gate-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; font-size: 15px; }
  .gate ul { list-style: none; margin: 8px 0 0; padding: 0; font-size: 14px; }

<script id="rag-snapshot" type="application/json">{"1-1": {"text": "검토 결과: 부분 충족\n\n근거(참고문서):\n- “작업에 종사하고 있는 근로자 또는 그 근로자를 감시하는 사람은 이상을 발견하면 즉시 로봇의 운전을 정지시키기 위한 조치를 할 것”(조항 2)\n- “이상을 발견하여 로봇의 운전을 정지시킨 후 이를 재가동시킬 경우의 조치”(조항 마) — 재가동 절차 마련 필요성 시사(세부 내용은 미제시)\n- “작업 중에는 기동스위치 등에 작업 중 표시를 하는 등, 작업자가 아닌 사람이 스위치 등을 조작할 수 없도록 필요한 조치를 할 것”(조항 3)\n\n해석:\n- 비상상황이라는 용어가 직접적으로 명시되지는 않았으나, “이상 발견 시 즉시 정지 조치” 의무가 있어 비상 시 운전을 중단하는 절차의 필요성과 취지가 부합합니다.\n- 다만 “수동으로”라는 방식(예: 수동 스위치/버튼 등)은 참고문서에서 확인할 수 없음.\n- 정지 후 재가동에 관한 조치가 필요하다는 점은 명시되어 있으나, 구체 내용은 참고문서에서 확인할 수 없음.\n\n추가 확인 필요:\n- “수동” 중단 방식의 구체 수단 및 절차: 참고문서에서 확인할 수 없음.", "at": "2026. 10. 18. 오후 4:39:45"}, "2-1": {"text": "참고문서에서 확인할 수 없음\n\n근거: 참고문서는\n- 로봇의 조작방법 및 순서\n- 이상 발견 후 정지 및 재가동 시 조치\n- 예기치 못한 작동 또는 오조작 위험 방지 조치\n만을 언급하며, 원격 조종 상태나 신호등 규정 준수에 대한 내용은 없습니다.", "at": "2026. 10. 18. 오후 4:40:26"}, "v8-1": {"text": "검토 결과: 참고문서에서 확인할 수 없음\n\n관련하여 참고문서에 따른 필수 조치:\n- 작업자 또는 감시자는 이상을 발견하면 즉시 로봇 운전을 정지시키기 위한 조치를 할 것\n- 로봇의 예기치 못한 작동 또는 오조작에 의한 위험을 방지하기 위한 필요한 조치를 마련할 것\n- 이상을 발견하여 로봇을 정지시킨 후 재가동시키는 경우의 조치를 마련할 것", "at": "2026. 10. 18. 오후 4:41:04"}, "3-1": {"text": "아래 사항 외에 “로봇 여러 대 동시 작업 시 충돌 예방·중지 기준”에 관한 구체 기준은 참고문서에서 확인할 수 없음.\n\n참고문서로 확인되는 중지 관련 기준:\n- 이상 발견 시 즉시 정지: 작업에 종사하는 근로자 또는 감시자는 이상을 발견하면 즉시 로봇 운전을 정지하기 위한 조치를 해야 함.\n- 수리·검사·조정(교시 제외)·청소·급유·결과 확인 작업 시 정지 및 오조작 방지: 로봇 작동범위 내에서 위 작업을 하는 동안에는\n  - 로봇 운전을 정지하고,\n  - 기동스위치를 열쇠로 잠그고 열쇠를 별도 관리하거나, 기동스위치에 “작업 중” 표지를 부착하는 등\n  - 해당 작업자가 아닌 사람이 기동스위치를 조작할 수 없도록 필요한 조치를 해야 함.\n- 작업 중 표시 의무: 작업을 하고 있는 동안 기동스위치 등에 “작업 중” 표시 등을 해 작업자가 아닌 사람이 스위치를 조작하지 못하도록 해야 함.\n- 예외: 운전 중 작업이 불가피하고 제222조 각 호의 조치를 한 경우에는 위 정지 의무 적용 제외. 다만 제222조의 구체 조치 내용은 참고문서에서 확인할 수 없음.", "at": "2026. 10. 18. 오후 4:41:40"}, "v2-1": {"text": "검토 결과 요약\n- 이종 로봇이 적재·피킹·운반·정리를 연계 수행해야 한다는 기능 요건: 참고문서에서 확인할 수 없음.\n- 작업자가 설비를 조작할 수 있는 사용자 환경(UI) 제공 요건: 참고문서에서 확인할 수 없음.\n\n관련 법령상 반드시 반영되어야 할 안전조치 요건(요구사항에 미반영)\n- 제222조(교시 등): 작업자가 로봇의 작동범위에서 교시 등의 작업을 하는 경우, 로봇의 예기치 못한 작동 또는 오조작에 의한 위험을 방지하는 조치를 해야 함. 다만, 로봇의 구동원을 차단하고 작업하는 경우에는 제2호와 제3호의 조치를 하지 않을 수 있음.\n- 제223조(운전 중 위험 방지): 로봇 운전으로 인한 근로자 위험 방지를 위해\n  - 높이 1.8m 이상의 울타리를 설치해야 함(로봇의 가동범위 등을 고려하여 높이로 인한 위험성이 없는 경우에는 그 이하로 조절 가능).\n  - 컨베이어 시스템 설치 등으로 울타리 설치가 불가능한 일부 구간에는 안전매트 또는 광전자식 방호장치 등 감응형 방호장치를 설치해야 함.\n  - 예외: 고용노동부장관이 해당 로봇의 안전기준이 한국산업표준 또는 국제적으로 통용되는 안전기준에 부합한다고 인정하는 경우, 위 조치를 하지 않을 수 있음.\n  - 범위: 제222조에 따른 교시 등을 위한 로봇의 운전과 제224조 단서에 따른 운전은 제외.\n\n적합성 판단\n- 현재 요구사항에는 제222조 및 제223조의 안전조치(울타리/감응형 방호장치 설치, 교시 시 위험 방지 조치 등)가 명시되어 있지 않아 참고문서 기준 충족 여부를 확인할 수 없음.\n\n보완 필요 사항(참고문서 근거)\n- 교시 등을 작업자가 수행할 수 있는 요구가 내포되어 있거나, 작업자가 로봇 작동범위에서 조작할 수 있는 사용자 환경을 제공하는 경우:\n  - 제222조에 따른 “예기치 못한 작동·오조작 위험 방지 조치”를 포함하고, 구동원 차단 시 예외 적용 가능함을 명시.\n- 로봇 운전이 이루어지는 설비/라인:\n  - 제223조에 따른 울타리(원칙 1.8m) 설치 및 울타리 불가 구간의 감응형 방호장치 설치를 포함.\n  - 또는 고용노동부장관 인정에 따른 안전기준 부합 시 제223조 본문 조치 생략 가능함을 명시.", "at": "2026. 10. 18. 오후 4:42:40"}, "4-1": {"text": "판단: 부분 부합\n\n근거\n- 제223조: 로봇 운전으로 인한 위험 방지를 위해 원칙적으로 높이 1.8m 이상의 울타리를 설치해야 하며, 울타리 설치가 어려운 일부 구간에는 안전매트 또는 광전자식 방호장치 등 감응형 방호장치를 설치해야 함. 이는 근로자 접근 시 위험을 방지하기 위한 수단으로 “감응형 방호장치” 설치를 요구하고 있어 접근 시 로봇을 정지시키는 방식의 안전 확보와 취지가 부합함.\n- 조항 2: 작업 종사자 또는 감시자는 이상 발견 시 즉시 로봇 운전을 정지시키기 위한 조치를 해야 함. 정지 기능(또는 정지 조치 체계)의 필요성을 뒷받침.\n\n확인 불가/미충족 사항\n- “사람이 접근가능한 위치에 있는 경우 로봇이 자동으로 속도를 늦춰야 한다”는 감속 요구: 참고문서에서 확인할 수 없음.\n- “접근 시 자동 정지”를 로봇 자체 기능으로 구현해야 한다는 직접적 의무: 참고문서에서 확인할 수 없음. 문서는 주로 울타리 설치와, 불가 구간의 감응형 방호장치 설치를 요구함.\n- 감응형 방호장치의 작동 방식(정지 vs 감속 등) 상세: 참고문서에서 확인할 수 없음.\n\n이행 시사점\n- 울타리(1.8m 이상) 설치가 원칙이며, 불가 구간에는 안전매트·광전자식 방호장치 등 감응형 방호장치 설치.\n- 이상 발견 시 즉시 정지하도록 인력·절차·설비(정지 조치) 확보.\n- 작업 중 표시에 의해 비작업자의 스위치 조작 방지.\n- 예외: 고용노동부장관이 안전기준 부합을 인정한 경우에는 제223조 본문 조치를 하지 않을 수 있음.", "at": "2026. 10. 18. 오후 4:44:06"}}</script>

  // ---------- REVIEW CLOSURE (human-in-the-loop) ----------
  // AI output is a set of candidates: the viewer adopts/excludes items, resolves each Engineering
  // Review question, and enters decided values, which replace the matching [placeholder] in the
  // revised requirement. Stored per viewer in this browser only (a demo, not shared records).
  // Uses its own storage key so it never mixes with other versions of this PoC.
  // If this browser has no saved review yet, an embedded snapshot (the author's actual review,
  // pasted into #review-snapshot) is used so the evaluation page shows real counts to visitors.
  var REVIEW_KEY = 'rqg-dify-review-v1';
  var review = {}, reviewSource = 'empty';
  var SNAPSHOT = {};
  try { SNAPSHOT = JSON.parse(document.getElementById('review-snapshot').textContent || '{}') || {}; } catch (e) { SNAPSHOT = {}; }
  try {
    var stored = localStorage.getItem(REVIEW_KEY);
    if (stored) { review = JSON.parse(stored) || {}; reviewSource = 'local'; }
  } catch (e) { review = {}; }
  if (reviewSource === 'empty' && Object.keys(SNAPSHOT).length) { review = JSON.parse(JSON.stringify(SNAPSHOT)); reviewSource = 'snapshot'; }
  function saveReview() { reviewSource = 'local'; try { localStorage.setItem(REVIEW_KEY, JSON.stringify(review)); } catch (e) {} }

  // ---------- evidence basis (AI 판단 근거 + 불확실성) ----------

  var ROUTE = {

  };
  function rchip(t) { return '<span class="rchip r-' + t + '" title="' + escAttr(ROUTE[t].desc) + '">' + ROUTE[t].label + '</span>'; }
  function erRoute(req, i) { return (req.er_route || [])[i] || 'E'; }

  var EXCLUDE_WHY = [
    { key: 'dup', label: '중복' },
    { key: 'scope', label: '요구범위 과도 확장' },

  var GROUP_NAME = {
    handoff: '사람 개입·승인 요청', failsafe: '통신 이상 감지·페일세이프', stop: '정지·재가동 승인',
    rbac: '권한 등급·인증', lowconf: 'AI 저신뢰도 보류·안전 처리', state: '작업·주문 상태 전이 관리',
    proximity: '주변 감지 기반 감속·정지', alloc: '다중 로봇 작업 배정·우선순위', retrain: '인식 실패 데이터 재학습',
    alert: '이상 알림·통보', override: '안전 규칙 우선 명령 차단'
  };
  function pcConfirmed(rid, i) { return review[rid + '|pc|' + i] || ''; }

  var ER_STATUS = [
    { key: 'open', label: '미확정' },
    { key: 'review', label: '검토 중' },
    { key: 'closed', label: '확정' },
    { key: 'out', label: '범위 제외' }
  ];
  var REQ_INDEX = {};
  DATA.cases.forEach(function (c) {
    c.requirements.forEach(function (r) { REQ_INDEX[r.id] = { req: r, caseType: c.case_type, caseId: c.id, caseTitle: c.title }; });
  });

  var GROUP_REQS = {};
  DATA.cases.forEach(function (c) {
    c.requirements.forEach(function (r) {
      (r.product || []).forEach(function (p, i) {
        if (p.ai === 'common' && p.group) (GROUP_REQS[p.group] = GROUP_REQS[p.group] || []).push({ rid: r.id, idx: i });
      });
    });
  });
  function groupCount(g) { return (GROUP_REQS[g] || []).length; }

  var PH_RE = /\[[^\]]+\]/g;
  function placeholders(req) { return String(req.revised_requirement || '').match(PH_RE) || []; }
  function erStatus(rid, i) { return review[rid + '|er|' + i] || 'open'; }
  function phValue(rid, i) { return String(review[rid + '|ph|' + i] || '').trim(); }
  function decision(rid, kind, i) { return review[rid + '|' + kind + '|' + i] || ''; }

  // A [placeholder] tied to an Engineering Review question marked 범위 제외 is N/A: it no longer blocks
  // the requirement from being confirmed, and its bracket is shown as N/A in the After text.
  function phNA(req, i) {
    var link = (req.placeholder_links || [])[i];
    return typeof link === 'number' && link >= 0 && erStatus(req.id, link) === 'out';
  }

  function reviewStats(req) {
    var rid = req.id;
    var eng = req.engineering_review_required || [];
    var phs = placeholders(req);
    var s = { erTotal: eng.length, erDone: 0, phTotal: 0, phFilled: 0, phNA: 0, mi: { adopt: 0, exclude: 0 }, ac: { adopt: 0, exclude: 0 },
      route: { P: { total: 0, done: 0 }, E: { total: 0, done: 0 } } };
    eng.forEach(function (_, i) {
      var st = erStatus(rid, i), rt = s.route[erRoute(req, i)];
      rt.total++;
      if (st === 'closed' || st === 'out') { s.erDone++; rt.done++; }
    });
    phs.forEach(function (_, i) {
      if (phNA(req, i)) { s.phNA++; return; }
      s.phTotal++;
      if (phValue(rid, i)) s.phFilled++;
    });
    (req.missing_items || []).forEach(function (_, i) { var d = decision(rid, 'mi', i); if (d) s.mi[d]++; });
    (req.acceptance_criteria || []).forEach(function (_, i) { var d = decision(rid, 'ac', i); if (d) s.ac[d]++; });
    s.confirmed = s.erDone === s.erTotal && s.phFilled === s.phTotal;
    return s;
  }

  function renderRevised(req) {
    var rid = req.id, links = req.placeholder_links || [], i = -1;
    return esc(req.revised_requirement || '').replace(PH_RE, function (m) {
      i++;
      if (phNA(req, i)) return '<span class="ph ph-na" title="' + m.replace(/"/g, '&quot;') + ' — 범위 제외">N/A</span>';
      var v = phValue(rid, i);
      if (!v) return '<span class="ph ph-value">' + m + '</span>';
      var link = links[i];
      var closed = (typeof link === 'number' && link >= 0) ? erStatus(rid, link) === 'closed' : true;
      return '<span class="ph ' + (closed ? 'ph-filled' : 'ph-draft') + '" title="' + m.replace(/"/g, '&quot;') + '">' + esc(v) + '</span>';
    });
  }

  function afterInner(req) {
    var s = reviewStats(req);
    var state = s.confirmed
      ? '<span class="after-state done">Review 질문 완료</span>'
      : '<span class="after-state open">미정 ' + (s.phTotal - s.phFilled) + '개</span>';
    var label = s.confirmed ? 'After (Policy · Engineering Review 반영안)' : 'After (수정된 요구사항)';
    return '<span class="ba-label">' + label + state + '</span>' + renderRevised(req);
  }

  function chipHtml(req) {
    var s = reviewStats(req);
    return '<span class="req-progress' + (s.confirmed ? ' done' : '') + '" data-chip="' + escAttr(req.id) + '">' +
      (s.confirmed ? 'Review 질문 완료' : 'Review 질문 ' + s.erDone + '/' + s.erTotal) + '</span>';
  }

  function barInner(req) {
    var s = reviewStats(req);
    return (
      '<span>Policy 확정 <b>' + s.route.P.done + '/' + s.route.P.total + '</b></span>' +
      '<span>Engineering 확정 <b>' + s.route.E.done + '/' + s.route.E.total + '</b></span>' +
      '<span>미정 값 입력 <b>' + s.phFilled + '/' + s.phTotal + '</b></span>' +
      '<span>누락 조건 채택 <b>' + s.mi.adopt + '</b> · 제외 <b>' + s.mi.exclude + '</b></span>' +
      '<button class="btn" data-action="review-reset" data-rid="' + escAttr(req.id) + '">검토 초기화</button>'
    );
  }

  function idChip(prefix, i) { return '<span class="tr-id">' + prefix + '-' + (i + 1) + '</span>'; }

  // Coverage over the AI-proposed links (indices follow rank order = display order).
  function traceCoverage(req) {
    var t = req.traceability || { mi_to_er: [], ac_to_mi: [], ac_to_er: [] };
    var nMi = (req.missing_items || []).length;
    var acByMi = [], i;
    for (i = 0; i < nMi; i++) acByMi.push([]);
    var acOrphans = [];
    // Items the reviewer excluded (제외) drop out of the coverage check on both sides.
    (t.ac_to_mi || []).forEach(function (mis, a) {
      if (decision(req.id, 'ac', a) === 'exclude') return;
      if (!mis.length) acOrphans.push(a);
      mis.forEach(function (m) { if (acByMi[m]) acByMi[m].push(a); });
    });
    var miNoAc = [];
    acByMi.forEach(function (list, m) {
      if (!list.length && decision(req.id, 'mi', m) !== 'exclude') miNoAc.push(m);
    });
    // Route rule: Policy → ≥1 Policy question, Engineering → ≥1 Engineering question, both → one of each.
    var routeGaps = [];
    (req.basis || []).forEach(function (b, mi) {
      if (decision(req.id, 'mi', mi) === 'exclude') return;
      var have = {};
      ((t.mi_to_er || [])[mi] || []).forEach(function (ei) { have[erRoute(req, ei)] = true; });
      var need = b.route === 'B' ? ['P', 'E'] : [b.route];
      var miss = need.filter(function (x) { return !have[x]; });
      if (miss.length) routeGaps.push({ mi: mi, miss: miss });
    });
    return { acByMi: acByMi, acOrphans: acOrphans, miNoAc: miNoAc, routeGaps: routeGaps };
  }

  function decideHtml(rid, kind, i) {
    var d = decision(rid, kind, i);
    function b(val, text) {
      return '<button type="button" class="d-' + val + '" aria-pressed="' + (d === val) + '" data-action="decide" data-rid="' + escAttr(rid) +
        '" data-kind="' + kind + '" data-idx="' + i + '" data-val="' + val + '">' + text + '</button>';
    }
    var why = '';
    if (d === 'exclude') {
      var cur = review[rid + '|' + kind + '|' + i + '|why'] || '';
      why = '<select class="why-select' + (cur ? '' : ' unset') + '" data-rid="' + escAttr(rid) + '" data-kind="' + kind + '" data-idx="' + i + '" aria-label="제외 사유">' +
        '<option value="">제외 사유 선택</option>' +
        EXCLUDE_WHY.map(function (w) { return '<option value="' + w.key + '"' + (w.key === cur ? ' selected' : '') + '>' + w.label + '</option>'; }).join('') +
        '</select>';
    }
    return '<span class="decide">' + b('adopt', '채택') + b('exclude', '제외') + why + '</span>';
  }

  // Review-completion gate: stays "미완료" while any human decision on missing items is open.
  function gateStats(req) {
    var rid = req.id, s = reviewStats(req);
    var mis = req.missing_items || [], basis = req.basis || [];
    // Every AI-proposed missing item needs a human adopt/exclude decision before Review can complete.
    var miOpen = 0;
    mis.forEach(function (m, i) { if (!decision(rid, 'mi', i)) miOpen++; });
    var pcs = req.product || [], pcDone = 0;
    pcs.forEach(function (_, i) { if (pcConfirmed(rid, i)) pcDone++; });
    var whyMissing = 0;
    // Review gate covers missing items (MI) only — AC are follow-up verification drafts.
    mis.forEach(function (_, i) { if (decision(rid, 'mi', i) === 'exclude' && !review[rid + '|mi|' + i + '|why']) whyMissing++; });
    var checks = [
      { ok: miOpen === 0, text: '모든 누락 조건 채택 · 제외', note: miOpen ? '미결정 ' + miOpen + '건' : mis.length + '건 결정' },
      { ok: s.route.P.done === s.route.P.total, text: 'Policy Review 확정', note: s.route.P.done + '/' + s.route.P.total },
      { ok: s.route.E.done === s.route.E.total, text: 'Engineering Review 확정', note: s.route.E.done + '/' + s.route.E.total },
      { ok: s.phFilled === s.phTotal, text: '미정 값 입력', note: s.phFilled + '/' + s.phTotal },
      { ok: whyMissing === 0, text: '제외한 누락 조건 사유 기록', note: whyMissing ? '사유 없음 ' + whyMissing + '건' : '' }
    ];
    return { checks: checks, pass: checks.every(function (c) { return c.ok; }), pcDone: pcDone, pcTotal: pcs.length };
  }

  function gateInner(req) {
    var g = gateStats(req);
    var open = g.checks.filter(function (c) { return !c.ok; }).length;
    return (
      '<div class="gate-head"><span>' + (g.pass ? 'Requirement Review 완료 조건 충족' : 'Requirement Review 미완료 — 남은 결정 ' + open + '건') + '</span>' +
        '<span class="hstate ' + (g.pass ? 'ok' : '') + '">' + (g.pass ? '검토 완료 가능' : '추가 확인 필요') + '</span></div>' +
      '<ul>' + g.checks.map(function (c) {
        return '<li class="' + (c.ok ? 'ok' : 'wait') + '"><span class="ck">' + (c.ok ? '✓' : '·') + '</span><span>' + esc(c.text) +
          (c.note ? ' <span class="more-hint">' + esc(c.note) + '</span>' : '') + '</span></li>';
      }).join('') + '</ul>' +
      '<p class="gate-follow">후속 단계 · 제품화 분류 ' + g.pcDone + '/' + g.pcTotal + ' 확정 — Requirement Review와 별개로 진행합니다.</p>'
    );
  }

  function patchReview(rid) {
    var entry = REQ_INDEX[rid];
    if (!entry) return;
    var sel = '[data-rid="' + rid + '"]';
    var after = document.querySelector('.ba-after' + sel);
    if (after) after.innerHTML = afterInner(entry.req);
    var bar = document.querySelector('.review-bar' + sel);
    if (bar) bar.innerHTML = barInner(entry.req);
    var gate = document.querySelector('.gate' + sel);
    if (gate) { gate.innerHTML = gateInner(entry.req); gate.classList.toggle('pass', gateStats(entry.req).pass); }
    var chip = document.querySelector('[data-chip="' + rid + '"]');
    if (chip) chip.outerHTML = chipHtml(entry.req);
  }

  function rerenderReview(rid) {
    var entry = REQ_INDEX[rid];
    var body = document.querySelector('.req-body[data-rid="' + rid + '"]');
    if (!entry || !body) return;
    var prev = body.querySelector('.more-details');
    var wasOpen = !!(prev && prev.open);
    body.innerHTML = reqBodyInner(entry.req, entry.caseType);
    if (wasOpen) { var next = body.querySelector('.more-details'); if (next) next.open = true; }
    patchReview(rid);
  }

  function requirementBlockHtml(req, idx, total, caseType) {
    return (
      '<details class="req-block"' + (idx === 0 ? ' open' : '') + '>' +
        '<summary>' +
          '<span><span class="req-num">REQ ' + (idx + 1) + ' / ' + total + ' &middot; ' + esc(req.id) + '</span>' + chipHtml(req) + (RAG_SNAPSHOT[req.id] ? ragTag(1) : '') +
          '<p class="req-title">&ldquo;' + esc(req.requirement_text) + '&rdquo;</p></span>' +
          '<span class="req-caret">&#9656;</span>' +
        '</summary>' +
        '<div class="req-body" data-rid="' + escAttr(req.id) + '">' + reqBodyInner(req, caseType) + '</div>' +
      '</details>'
    );
  }

  // ---------- RAG REFERENCE (Dify Workflow via /api/review) ----------
  // The page never holds the Dify API key: it posts the requirement text to its own server
  // (server.py), which calls Dify and returns { result }.
  // Live results are kept in this browser (localStorage) and can be exported; exported real
  // results can be embedded in #rag-snapshot so static hosting (GitHub Pages) still shows them.
  var metaEp = document.querySelector('meta[name="rag-endpoint"]');
  var RAG_ENDPOINT = (metaEp && metaEp.getAttribute('content')) || '/api/review';
  var RAG_ABSOLUTE = /^https?:\/\//i.test(RAG_ENDPOINT);
  var STATIC_HOST = /\.github\.io$/i.test(location.hostname);
  var RAG_LIVE = RAG_ABSOLUTE || (location.protocol !== 'file:' && !STATIC_HOST);
  var RAG_KEY = 'rqg-dify-rag-v1';
  var rag = {};   // rid -> live state { status: 'loading' | 'done' | 'error', text, at, msg }
  var ragSaved = {};
  try { ragSaved = JSON.parse(localStorage.getItem(RAG_KEY) || '{}') || {}; } catch (e) { ragSaved = {}; }
  var RAG_SNAPSHOT = {};
  try { RAG_SNAPSHOT = JSON.parse(document.getElementById('rag-snapshot').textContent || '{}') || {}; } catch (e) { RAG_SNAPSHOT = {}; }
  function saveRag() { try { localStorage.setItem(RAG_KEY, JSON.stringify(ragSaved)); } catch (e) {} }
  function savedRag(rid) {
    if (ragSaved[rid]) return { text: ragSaved[rid].text, at: ragSaved[rid].at, from: 'local' };
    if (RAG_SNAPSHOT[rid]) return { text: RAG_SNAPSHOT[rid].text, at: RAG_SNAPSHOT[rid].at, from: 'snapshot' };
    return null;
  }
  function ragExport() {
    var out = {}, k;
    for (k in RAG_SNAPSHOT) out[k] = RAG_SNAPSHOT[k];
    for (k in ragSaved) out[k] = ragSaved[k];
    return out;
  }

  function parseRagJson(text) {
    var t = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```$/, '').trim();
    if (t.charAt(0) !== '{') return null;
    try {
      var o = JSON.parse(t);
      return (o && (o.source || o.article || o.evidence || o.unresolved)) ? o : null;
    } catch (e) { return null; }
  }

  function ragResultHtml(text) {
    var o = parseRagJson(text);
    if (o) {
      function list(a) { return (Array.isArray(a) ? a : (a ? [a] : [])).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join(''); }
      var arts = Array.isArray(o.article) ? o.article.join(', ') : (o.article || '');
      return (
        '<div class="rag-doc"><span class="rag-k">검색 문서</span>' + esc(Array.isArray(o.source) ? o.source.join(', ') : (o.source || '—')) +
          (arts ? ' · <b>' + esc(arts) + '</b>' : '') + '</div>' +
        (o.evidence ? '<div class="rag-sec"><span class="rag-k">법령 근거</span><ul class="rag-ok">' + list(o.evidence) + '</ul></div>' : '') +
        (o.unresolved ? '<div class="rag-sec"><span class="rag-k">문서만으로 확정할 수 없는 사항</span><ul class="rag-warn">' + list(o.unresolved) + '</ul></div>' : '') +
        (o.review_route ? '<div class="rag-sec"><span class="rag-k">제안 확인 경로</span>' + esc(o.review_route) + '</div>' : '')
      );
    }
    return '<div class="rag-text">' + esc(text) + '</div>';
  }

  var RAG_NOTE = '법령 해석이나 적용 판단이 아니라 검색된 근거의 요약입니다. 실제 적용 여부와 미확정 값은 Human Review에서 결정합니다.';
  function savedBlock(sv, lead) {
    var label = sv.from === 'snapshot' ? '저장된 Dify 조회 결과' : '이 브라우저에 저장된 조회 결과';
    return (lead ? '<p class="rag-saved-lead">' + lead + '</p>' : '') +
      '<p class="rag-saved"><span class="rag-badge">' + label + '</span> 조회 ' + esc(sv.at || '-') + '</p>' +
      ragResultHtml(sv.text) + '<p class="stage-note">' + RAG_NOTE + '</p>';
  }

  function ragInner(req) {
    var rid = req.id, r = rag[rid], sv = savedRag(rid);
    var btn = RAG_LIVE
      ? '<button class="btn" data-action="rag-query" data-rid="' + escAttr(rid) + '"' + (r && r.status === 'loading' ? ' disabled' : '') + '>' +
          ((r && r.status === 'done') || sv ? '다시 조회' : '법령 근거 조회') + '</button>'
      : '';
    var head =
      '<div class="rag-head"><h4>RAG Reference · 법령 근거 <span class="rag-src">Dify Workflow</span></h4>' + btn + '</div>' +
      '<p class="review-note">공개 법령인 <b>산업안전보건기준에 관한 규칙 중 로봇 관련 제222~224조</b>를 Knowledge로 등록하고, 이 요구사항과 관련된 근거를 검색합니다. 결과는 Review에 참고 근거를 더하는 것이며, 요구사항을 결정하지 않습니다. 등록 범위 밖의 내용은 「참고문서에서 확인할 수 없음」으로 표시됩니다.</p>';
    var body;
    if (r && r.status === 'loading') body = '<p class="rag-loading" role="status">법령 근거 검색 중...</p>';
    else if (r && r.status === 'done') body = ragResultHtml(r.text) + '<p class="stage-note">조회 ' + esc(r.at) + ' · ' + RAG_NOTE + '</p>';
    else if (r && r.status === 'error') {
      body = '<p class="rag-error" role="alert">법령 근거를 조회하지 못했습니다.' + (r.msg ? ' <span class="more-hint">' + esc(r.msg) + '</span>' : '') + '</p>';
      if (sv) body += savedBlock(sv, '실시간 조회 대신 이전 조회 결과를 표시합니다.');
    }
    else if (sv) body = savedBlock(sv, RAG_LIVE ? '' : '이 페이지에서는 실시간 조회를 하지 않고, 실제 Dify 응답을 저장한 결과를 보여줍니다.');
    else if (!RAG_LIVE) body = '<p class="empty">저장된 조회 결과가 없습니다. 실시간 조회는 로컬 서버(start.bat)로 실행한 화면에서 할 수 있습니다.</p>';
    else body = '<p class="empty">아직 조회하지 않았습니다.</p>';
    return head + body;
  }

  function patchRag(rid) {
    var el = document.querySelector('.rag-card[data-rag="' + rid + '"]');
    var entry = REQ_INDEX[rid];
    if (el && entry) el.innerHTML = ragInner(entry.req);
  }

  function runRag(rid) {
    var entry = REQ_INDEX[rid];
    if (!RAG_LIVE || !entry || (rag[rid] && rag[rid].status === 'loading')) return;
    rag[rid] = { status: 'loading' };
    patchRag(rid);
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 130000);
    fetch(RAG_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requirement: entry.req.requirement_text }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok || typeof data.result !== 'string' || !data.result.trim()) throw new Error(data.error || ('HTTP ' + res.status));
        return data.result;
      });
    }).then(function (text) {
      var at = new Date().toLocaleString('ko-KR');
      rag[rid] = { status: 'done', text: text, at: at };
      ragSaved[rid] = { text: text, at: at };
      saveRag();
    }).catch(function (err) {
      rag[rid] = { status: 'error', msg: err && err.name === 'AbortError' ? '응답 시간 초과' : (err && err.message ? err.message : '') };
    }).then(function () { clearTimeout(timer); patchRag(rid); });
  }

  function reqBodyInner(req, caseType) {
    var rid = req.id;
    var missing = sortByRank(req.missing_items);
    var eng = sortByRank(req.engineering_review_required);
    var ac = sortByRank(req.acceptance_criteria);
    var phs = placeholders(req);
    var links = req.placeholder_links || [];

    function missingHtml() {
      if (!missing.length) return '<p class="empty">해당 없음</p>';
      var basis = req.basis || [];
      var cnt = { S: 0, I: 0, P: 0, E: 0, B: 0 };
      basis.forEach(function (b) { cnt[b.type]++; cnt[b.route]++; });
      var sum = '<div class="basis-sum"><span class="sum-k">판단 근거</span>' + ['S', 'I'].map(function (t) { return bchip(t) + ' ' + cnt[t] + '건'; }).join('') +
        '<span class="sum-k">확인 경로</span>' + ['P', 'E', 'B'].filter(function (t) { return cnt[t]; }).map(function (t) { return rchip(t) + ' ' + cnt[t] + '건'; }).join('') + '</div>' +
        '<div class="criteria"><span><b class="c-adopt">채택</b> 개발 전에 확인해야 할 유효한 누락 조건</span>' +
        '<span><b class="c-exclude">제외</b> 요구사항 검토 단계에서 불필요하거나 범위를 벗어난 AI 제안</span>' +
        '<span class="c-note">누가 결정할지는 채택 여부가 아니라 확인 경로로 구분합니다.</span></div>';
      return sum + '<ul class="review-list">' + missing.map(function (m, i) {
        var d = decision(rid, 'mi', i);
        var b = basis[i];
        var why = review[rid + '|mi|' + i + '|why'];
        var hs = d === 'adopt' ? '<span class="hstate ok">사람 채택</span>'
          : d === 'exclude' ? '<span class="hstate no">사람 제외' + (why ? ' · ' + esc(whyLabel(why)) : '') + '</span>'
          : '<span class="hstate">사람 확인 필요</span>';
        return '<li class="' + (d === 'exclude' ? 'is-excluded' : '') + '"><span class="item-text"><span>' + idChip('MI', i) + badge(m.priority) + ' [' + esc(m.category) + '] ' + esc(m.item) + '</span>' +
          (b ? '<span class="why-line">' + bchip(b.type) + '<span><b>판단 근거</b> ' + esc(b.why) + '</span></span>' +
            '<span class="why-line"><b>확인 경로</b> ' + rchip(b.route) + hs + '</span>' : '') +
          '</span>' + decideHtml(rid, 'mi', i) + '</li>';
      }).join('') + '</ul>';
    }

    function productHtml() {
      var pcs = req.product || [];
      if (!pcs.length) return '';
      var items = pcs.map(function (p, i) {
        var conf = pcConfirmed(rid, i);
        var segs = ['common', 'config', 'custom'].map(function (k) {
          return '<button type="button" class="k-' + k + (p.ai === k ? ' is-ai' : '') + '" aria-pressed="' + (conf === k) + '" data-action="classify" data-rid="' + escAttr(rid) + '" data-idx="' + i + '" data-val="' + k + '">' + PCLASS[k] + '</button>';
        }).join('');
        var moved = conf && conf !== p.ai ? '<span class="moved">AI 제안 ' + PCLASS[p.ai] + ' → 사람 ' + PCLASS[conf] + '</span>' : '';
        var grp = p.group && p.ai === 'common' ? ' · 후보군 「' + esc(GROUP_NAME[p.group]) + '」 ' + groupCount(p.group) + '개 요구사항에서 반복' : '';
        return '<li class="pc-item"><span class="pc-label">' + esc(p.label) + moved +
          '<span class="pc-ai"><span class="kchip k-' + p.ai + '-c">AI 제안 · ' + PCLASS[p.ai] + '</span> ' + esc(PCLASS_WHY[p.ai]) + grp + '</span></span>' +
          '<span class="seg" role="group" aria-label="분류 확정">' + segs + '</span></li>';
      }).join('');
      return (
        '<div class="stage">' +
          '<p class="stage-num">⑤ 제품화 분류 — 공통 기능 · 설정 · 고객 특화 <span class="exp-tag">Experimental</span></p>' +
          '<p class="review-note">AI가 요구사항을 제품 표준 기능 후보, 설정값, 고객 특화로 나눠 제안합니다. 검토자가 하나를 눌러 확정하며, AI 표시는 AI 제안 분류입니다. 확정 결과는 <a href="#" data-action="go-board">제품화 분류 보드</a>에 모입니다.</p>' +
          '<div class="subcard"><ul class="pc-list">' + items + '</ul></div>' +
        '</div>'
      );
    }
    function phFieldHtml(i) {
      var na = phNA(req, i);
      return '<span class="ph ' + (na ? 'ph-na' : 'ph-value') + '">' + esc(phs[i]) + '</span>' +
        '<input class="ph-input" type="text" data-rid="' + escAttr(rid) + '" data-ph="' + i + '" value="' + escAttr(na ? '' : phValue(rid, i)) + '"' +
        (na ? ' disabled placeholder="범위 제외 — N/A"' : ' placeholder="결정값 입력"') + ' aria-label="' + escAttr(phs[i]) + ' 결정값">';
    }
    function erItemHtml(e, i) {
      var st = erStatus(rid, i);
      var opts = ER_STATUS.map(function (o) {
        return '<option value="' + o.key + '"' + (o.key === st ? ' selected' : '') + '>' + o.label + '</option>';
      }).join('');
      var fields = [];
      links.forEach(function (l, p) { if (l === i) fields.push(phFieldHtml(p)); });
      return (
        '<div class="er-item st-' + st + '">' +
          '<div class="er-head"><span>' + idChip('RV', i) + badge(e.priority) + (e.added ? '<span class="added-tag" title="추적 점검에서 확인 경로에 맞는 질문이 없어 보완한 질문">보완</span>' : '') + ' ' + esc(e.question) + '</span>' +
            '<select class="er-status st-' + st + '" data-rid="' + escAttr(rid) + '" data-er="' + i + '" aria-label="검토 상태">' + opts + '</select>' +
          '</div>' +
          (fields.length ? '<div class="ph-fields">' + fields.join('') + '</div>' : '') +
        '</div>'
      );
    }
    function reviewHtml(route) {
      var items = eng.map(function (e, i) { return erRoute(req, i) === route ? erItemHtml(e, i) : ''; }).join('');
      var extraHtml = '';
      if (route === 'P') {
        var extra = [];
        phs.forEach(function (_, p) { var l = links[p]; if (!(typeof l === 'number' && l >= 0)) extra.push(phFieldHtml(p)); });
        if (extra.length) extraHtml = '<p class="er-extra-title">질문 외 추가 결정 항목 (범위 · 대상 · 담당자)</p><div class="ph-fields">' + extra.join('') + '</div>';
      }
      if (!items && !extraHtml) return '<p class="empty">해당 질문 없음</p>';
      return items + extraHtml;
    }
    function engHtml() {
      return '<p class="review-note">상태를 정하고 결정값을 입력하면 ③ After에 바로 반영됩니다. 입력 내용은 이 브라우저에만 저장됩니다.<br>' +
        rchip('B') + ' 항목은 두 역할의 결정이 모두 필요한 누락 조건이며, Review 단계에서는 Policy 질문과 Engineering 질문으로 나누어 확인합니다.</p>' +
        '<div class="subcard-grid">' +
          '<div class="subcard route-card r-card-P"><h4>' + rchip('P') + ' PM · 업무 담당자 결정</h4>' + reviewHtml('P') + '</div>' +
          '<div class="subcard route-card r-card-E"><h4>' + rchip('E') + ' 엔지니어 검토</h4>' + reviewHtml('E') + '</div>' +
        '</div>';
    }
    function ambiguousHtml() {
      if (!req.ambiguous_terms || !req.ambiguous_terms.length) return '<p class="empty">해당 없음</p>';
      return '<ul>' + req.ambiguous_terms.map(function (t) {
        return '<li><b>' + esc(t.term)+ '</b><span class="basis">' + esc(t.issue) + '</span></li>';
      }).join('') + '</ul>';
    }
    function acHtml(withButtons) {
      if (!ac.length) return '<p class="empty">해당 없음</p>';
      return '<ul class="ac-list">' + ac.map(function (c, i) {
        var d = decision(rid, 'ac', i);
        return '<li class="ac-item' + (d === 'exclude' ? ' is-excluded' : '') + '"><span class="item-text">' + idChip('AC', i) + badge(c.priority) + ' ' + esc(c.criterion) + '</span>' +
          (withButtons ? decideHtml(rid, 'ac', i) : '') + '</li>';
      }).join('') + '</ul>';
    }

    // Similar requirements from other cases in this PoC. Shows the other item's actual ER questions and,
    // if this viewer already confirmed them in this browser, the decided values (reuse of past decisions).
    function similarHtml() {
      var sims = (req.similar || []).filter(function (s) { return REQ_INDEX[s.other_id]; });
      var catChip = req.task_category ? '<span class="tag">업무 분류 · ' + esc(req.task_category) + '</span>' : '';
      if (!sims.length) {
        if (!req.task_category) return '';
        return (
          '<div class="stage">' +
            '<p class="stage-num">유사 검토 이력</p>' +
            '<p class="review-note">' + catChip + '</p>' +
            '<p class="empty">유사 검토 이력 없음 — 같은 업무 분류에서 답을 참고할 수 있는 Review 질문이 2개 이상 대응되는 사례가 이 PoC 데이터에 없습니다.</p>' +
          '</div>'
        );
      }
      var cards = sims.map(function (s) {
        var o = REQ_INDEX[s.other_id], oreq = o.req;
        var oeng = sortByRank(oreq.engineering_review_required);
        var oplinks = oreq.placeholder_links || [];
        var oph = placeholders(oreq);
        var pairs = s.er_pairs.map(function (pr) {
          var q = oeng[pr[1]], mine = eng[pr[0]];
          if (!q || !mine) return '';
          var st = erStatus(oreq.id, pr[1]);
          var label = ER_STATUS.filter(function (x) { return x.key === st; })[0].label;
          var vals = [];
          oplinks.forEach(function (l, p) { if (l === pr[1] && phValue(oreq.id, p)) vals.push(oph[p] + ' → ' + phValue(oreq.id, p)); });
          return '<li>' + idChip('RV', pr[0]) + '<span class="sim-arrow">↔</span>' + esc(o.caseTitle) + ' ' + idChip('RV', pr[1]) + esc(q.question) +
            '<span class="tr-state st-' + st + '">' + label + '</span>' +
            (vals.length ? '<span class="sim-vals">확정값: ' + esc(vals.join(', ')) + '</span>' : '') + '</li>';
        }).join('');
        return (
          '<div class="sim-card">' +
            '<div class="sim-head"><span class="sim-topic">공통 결정 항목 · ' + esc(s.topic) + '</span>' +
              '<button class="btn" data-action="open-case" data-case-id="' + escAttr(o.caseId) + '" data-req-id="' + escAttr(oreq.id) + '">' + esc(o.caseTitle) + ' · ' + esc(oreq.id) + ' 보기 &rarr;</button></div>' +
            '<p class="sim-req">&ldquo;' + esc(oreq.requirement_text) + '&rdquo;</p>' +
            (pairs ? '<ul class="sim-pairs">' + pairs + '</ul>' : '') +
          '</div>'
        );
      }).join('');
      return (
        '<div class="stage">' +
          '<p class="stage-num">유사 검토 이력 — 다른 사례에서 이미 검토한 요구사항</p>' +
          '<p class="review-note">' + catChip + ' 같은 업무 분류에서 공통 결정 항목이 2개 이상인 사례를 최대 2건 표시합니다. 별도 이력 DB가 아닌 PoC 분석 데이터 내 유사 사례입니다.</p>' +
          cards +
        '</div>'
      );
    }

    function traceHtml() {
      var t = req.traceability;
      if (!t || !missing.length) return '';
      var cov = traceCoverage(req);
      function erCell(idxs) {
        if (!idxs.length) return '<span class="tr-warn">— 연결된 Review 없음</span>';
        return idxs.map(function (ei) {
          var st = erStatus(rid, ei);
          var label = ER_STATUS.filter(function (o) { return o.key === st; })[0].label;
          return '<span class="cell-item" title="' + escAttr(eng[ei].question) + '">' + idChip('RV', ei) + rchip(erRoute(req, ei)) + ' ' + esc(eng[ei].question) +
            '<span class="tr-state st-' + st + '">' + label + '</span></span>';
        }).join('');
      }
      function acCell(idxs) {
        if (!idxs.length) return '<span class="tr-warn">⚠ 검증하는 AC 없음</span>';
        return idxs.map(function (ai) {
          return '<span class="cell-item' + (decision(rid, 'ac', ai) === 'exclude' ? ' is-excluded' : '') + '">' + idChip('AC', ai) + esc(ac[ai].criterion) + '</span>';
        }).join('');
      }
      var rows = missing.map(function (m, i) {
        var excluded = decision(rid, 'mi', i) === 'exclude';
        return '<tr>' +
          '<td><span class="cell-item' + (excluded ? ' is-excluded' : '') + '">' + idChip('MI', i) + badge(m.priority) + ' ' + esc(m.item) + '</span>' + (req.basis && req.basis[i] ? rchip(req.basis[i].route) : '') + '</td>' +
          '<td>' + erCell(t.mi_to_er[i] || []) + '</td>' +
          '<td>' + (excluded ? '<span class="tr-state">제외한 조건 — 점검 대상 아님</span>' : acCell(cov.acByMi[i])) + '</td>' +
        '</tr>';
      }).join('');
      var warns = [];
      cov.acOrphans.forEach(function (ai) { warns.push('AC-' + (ai + 1) + '은 연결된 누락 조건이 없습니다 — 근거 확인이 필요합니다.'); });
      cov.miNoAc.forEach(function (mi) { warns.push('MI-' + (mi + 1) + '을 검증하는 AC가 없습니다.'); });
      cov.routeGaps.forEach(function (g) { warns.push('MI-' + (g.mi + 1) + '의 확인 경로에 맞는 ' + g.miss.map(function (x) { return ROUTE[x].label; }).join(' · ') + ' 질문이 연결되지 않았습니다.'); });
      var foot = warns.length
        ? '<div class="trace-warns">추적 확인 필요 ' + warns.length + '건<ul>' + warns.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>'
        : '<p class="trace-ok">모든 누락 조건이 AC로 검증되고, 확인 경로에 맞는 Review 질문에 연결되어 있습니다.</p>';
      return (
        '<div class="stage">' +
          '<p class="stage-num">Traceability — 누락 조건 → Policy · Engineering Review → AC</p>' +
          '<div class="table-wrap"><table class="trace"><thead><tr><th>누락 조건</th><th>Policy / Engineering Review</th><th>Acceptance Criteria</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
          foot +
          '<p class="stage-note">※ 점검 규칙: Policy → Policy 질문 1개 이상, Engineering → Engineering 질문 1개 이상, Policy + Engineering → 양쪽 질문 각 1개 이상. 연결은 AI가 제안한 것이며 검토자가 확인해야 합니다. 「보완」 질문은 이 점검에서 빠진 경로를 채우려고 추가한 질문입니다.</p>' +
        '</div>'
      );
    }

    var stageOneLabel = caseType === 'value' ? '① 도입 사례 기반 가상 요구사항'
      : caseType === 'risk' ? '① 사고 기반 가상 요구사항'
      : '① 입력한 요구사항';
    var stageOneNote = caseType === 'value' ? '※ 실제 도입 사례 사실을 기반으로 작성한 가상 요구사항입니다.'
      : caseType === 'risk' ? '※ 실제 사고 사실을 기반으로 작성한 가상 요구사항입니다.'
      : '※ 직접 입력하신 요구사항 문장입니다.';

    return (
          '<div class="review-bar" data-rid="' + escAttr(rid) + '">' + barInner(req) + '</div>' +
          '<div class="stage">' +
            '<p class="stage-num">' + stageOneLabel + '</p>' +
            '<div class="virtual-req">&ldquo;' + esc(req.requirement_text) + '&rdquo;</div>' +
            '<p class="stage-note">' + stageOneNote + '</p>' +
          '</div>' +
          '<div class="stage">' +
            '<p class="stage-num">② AI Quality Gate — 누락 조건 · 판단 근거 · 확인 경로</p>' +
            '<div class="subcard"><h4>누락 조건 — AI 제안과 판단 근거</h4>' + missingHtml() + '</div>' +
            '<div class="subcard subcard-full rag-card" data-rag="' + escAttr(rid) + '">' + ragInner(req) + '</div>' +
            '<div class="subcard subcard-full"><h4>Review 질문 — 확인 경로별 검토 · 확정</h4>' + engHtml() + '</div>' +
          '</div>' +
          '<div class="stage">' +
            '<p class="stage-num">③ Before &rarr; After</p>' +
            '<div class="before-after">' +
              '<div class="ba-block ba-before"><span class="ba-label">Before (원본)</span>' + esc(req.requirement_text) + '</div>' +
              '<div class="ba-arrow">&darr;</div>' +
              '<div class="ba-block ba-after" data-rid="' + escAttr(rid) + '">' + afterInner(req) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="stage">' +
            '<p class="stage-num">④ Acceptance Criteria (초안)</p>' +
            acHtml(false) +
          '</div>' +
          productHtml() +
          '<div class="stage">' +
            '<p class="stage-num">⑥ Human Review &amp; Fallback — Requirement Review 완료 조건</p>' +
            '<div class="gate' + (gateStats(req).pass ? ' pass' : '') + '" data-rid="' + escAttr(rid) + '">' + gateInner(req) + '</div>' +
            '<div class="policy"><b>예외 처리 정책</b><ul>' +
              '<li>AI가 제안한 누락 조건은 사람이 채택 또는 제외해야 하며, 미결정 항목이 남아 있으면 Review를 완료하지 않습니다.</li>' +
              '<li>제외한 항목은 사유(중복 · 요구범위 과도 확장 · 상세설계·시험설계 단계 · 기타)를 남겨 AI 제안 검토 결과에 사용합니다.</li>' +
              '<li>Policy · Engineering Review가 확정되기 전까지 결정값은 [값]으로 유지하고, AI가 값을 채우지 않습니다.</li>' +
              '<li>범위 제외로 닫힌 Review 질문에 연결된 [값]은 N/A로 처리해 확정을 막지 않습니다.</li>' +
              '<li>AC는 후속 검증 초안으로 Review 완료 조건에 포함하지 않습니다.</li>' +
            '</ul></div>' +
          '</div>' +
          '<details class="more-details">' +
            '<summary>상세 검토 정보 보기 <span class="more-hint">모호한 표현 · AC 초안 검토 · Traceability · 유사 검토 이력</span></summary>' +
            '<div class="more-body">' +
              '<div class="stage"><p class="stage-num">모호한 표현</p><div class="subcard">' + ambiguousHtml() + '</div></div>' +
              '<div class="stage"><p class="stage-num">AC 초안 개별 검토 — AI 생성 초안 (검토 결과 집계 제외)</p>' + acHtml(true) + '</div>' +
              traceHtml() +
              similarHtml() +
            '</div>' +
          '</details>'
    );
  }

  function renderDetail(caseId) {
    var c = DATA.cases.filter(function (x) { return x.id === caseId; })[0];
    if (!c) { renderHome(); return; }
    var reqsHtml = c.requirements.map(function (r, i) { return requirementBlockHtml(r, i, c.requirements.length, c.case_type); }).join('');
    var tags = c.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    var sectionTitle = c.case_type === 'value' ? '도입 사례에서 도출한 가상 요구사항' : '사고에서 도출한 가상 요구사항';
    var sectionSub = c.case_type === 'value'
      ? '각 항목을 펼치면 도입 사례 기반 요구사항 → 품질 분석 → 수정안 → Acceptance Criteria까지 전체 흐름을 볼 수 있습니다.'
      : '각 항목을 펼치면 사고 기반 요구사항 → 품질 분석 → 수정안 → Acceptance Criteria까지 전체 흐름을 볼 수 있습니다.';

    app.innerHTML =
      navHtml('detail') +
      '<button class="btn btn-back" data-action="go-home">&larr; 전체 사례로</button>' +
      '<div class="case-header">' +
        '<span class="badge-row"><span class="case-type-badge case-type-' + c.case_type + '">' + CASE_TYPE_LABEL[c.case_type] + '</span>' +
          (ragSampleCount(c) ? ragTag(ragSampleCount(c)) : '') + '</span>' +
        '<h2>' + esc(c.title) + '</h2>' +
        '<div class="meta-grid">' + newsBlock(c) + '</div>' +
        '<div class="summary-box">' + esc(c.summary) + '</div>' +
        '<div class="tag-row" style="margin-top:12px">' + tags + '</div>' +
      '</div>' +
      '<p class="section-title">' + sectionTitle + ' (' + c.requirements.length + '개)</p>' +
      '<p class="section-sub">' + sectionSub + '</p>' +
      priorityLegendHtml() +
      reqsHtml +
      footerNote();

    window.scrollTo({ top: 0 });
  }

  // ---------- PRODUCT BOARD (공통 기능 / 설정 / 고객 특화) ----------
  function allProductItems() {
    var out = [];
    DATA.cases.forEach(function (c) {
      c.requirements.forEach(function (r) {
        (r.product || []).forEach(function (p, i) {
          var conf = pcConfirmed(r.id, i);
          out.push({ rid: r.id, caseId: c.id, idx: i, p: p, conf: conf, eff: conf || p.ai });
        });
      });
    });
    return out;
  }
  function ridLink(it) { return '<span class="rid" data-action="open-case" data-case-id="' + escAttr(it.caseId) + '" data-req-id="' + escAttr(it.rid) + '">' + esc(it.rid) + '</span>'; }

  function renderBoard() {
    var items = allProductItems();
    var confirmed = items.filter(function (x) { return x.conf; });
    var agree = confirmed.filter(function (x) { return x.conf === x.p.ai; }).length;
    var byRid = {};
    items.forEach(function (x) { byRid[x.rid + '|' + x.idx] = x; });

    var groups = Object.keys(GROUP_REQS).map(function (g) {
      var members = GROUP_REQS[g].map(function (m) { return byRid[m.rid + '|' + m.idx]; });
      var confCommon = members.filter(function (x) { return x.conf === 'common'; }).length;
      return { g: g, members: members, confCommon: confCommon };
    }).sort(function (a, b) { return b.members.length - a.members.length || b.confCommon - a.confCommon; });
    var roadmapCount = groups.filter(function (x) { return x.confCommon >= 2; }).length;

    var groupHtml = groups.map(function (gr) {
      var cand = gr.confCommon >= 2;
      return '<div class="grp' + (cand ? ' roadmap-cand' : '') + '">' +
        '<div class="grp-head"><span class="grp-name">' + esc(GROUP_NAME[gr.g]) + '</span>' +
          '<span class="grp-count">AI 제안 ' + gr.members.length + '건 · 사람 확정 ' + gr.confCommon + '건</span></div>' +
        (cand ? '<span class="stage-chip stage-next">제품 표준화 검토 후보</span>' : '') +
        '<ul>' + gr.members.map(function (x) {
          var st = !x.conf ? '<span class="moved">미확정</span>'
            : x.conf === 'common' ? '<span class="moved" style="color:var(--value-ink)">공통 확정</span>'
            : '<span class="moved">→ ' + PCLASS[x.conf] + '로 변경</span>';
          return '<li>' + ridLink(x) + esc(x.p.label) + st + '</li>';
        }).join('') + '</ul></div>';
    }).join('');
    var promoted = items.filter(function (x) { return x.conf === 'common' && x.p.ai !== 'common'; });
    if (promoted.length) {
      groupHtml += '<div class="grp"><div class="grp-head"><span class="grp-name">사람이 공통 기능으로 재분류</span><span class="grp-count">' + promoted.length + '건</span></div><ul>' +
        promoted.map(function (x) { return '<li>' + ridLink(x) + esc(x.p.label) + '<span class="moved">AI 제안 ' + PCLASS[x.p.ai] + '</span></li>'; }).join('') + '</ul></div>';
    }

    function flatCol(kind) {
      var list = items.filter(function (x) { return x.eff === kind && !(kind === 'common'); });
      return '<ul class="flat-list">' + list.map(function (x) {
        var st = x.conf ? (x.conf !== x.p.ai ? '<span class="moved">AI 제안 ' + PCLASS[x.p.ai] + ' → 사람 확정</span>' : '<span class="moved" style="color:var(--value-ink)">확정</span>') : '<span class="moved">AI 제안</span>';
        return '<li>' + ridLink(x) + esc(x.p.label) + st + '</li>';
      }).join('') + '</ul>';
    }

    app.innerHTML =
      navHtml('board') +
      '<button class="btn btn-back" data-action="go-home">&larr; 홈으로</button>' +
      '<div class="hero">' +
        '<p class="eyebrow">Productization · Experimental</p>' +
        '<h1>제품화 분류 보드</h1>' +
        '<p class="lede">프로젝트별 요구를 공통 기능 · 설정 · 고객 특화로 나누고, 여러 사례에서 반복되는 공통 기능을 제품 표준화 검토 후보로 모읍니다.</p>' +
      '</div>' +
      '<div class="kpis">' +
        kpi('분류 요소', items.length, '요구사항 ' + Object.keys(REQ_INDEX).length + '건에서 AI가 분리') +
        kpi('사람 확정', confirmed.length, '미확정 ' + (items.length - confirmed.length) + '건') +
        kpi('AI 분류 유지율', confirmed.length ? Math.round(agree / confirmed.length * 100) + '%' : '—', confirmed.length ? '사람 확정 ' + confirmed.length + '건 중 AI 제안 유지 ' + agree + '건' : '확정 후 집계') +
        kpi('제품 표준화 검토 후보', roadmapCount, '공통 확정 2건 이상인 후보군') +
      '</div>' +
      '<div class="board">' +
        '<div class="board-col"><span class="kchip k-common-c">공통 기능 후보</span><h3>같은 동작이 여러 요구사항에서 반복</h3>' + groupHtml + '</div>' +
        '<div class="board-col"><span class="kchip k-config-c">설정값</span><h3>기능은 공통, 값만 현장별</h3>' + flatCol('config') + '</div>' +
        '<div class="board-col"><span class="kchip k-custom-c">고객 특화</span><h3>고객 시스템·현장에 종속</h3>' + flatCol('custom') + '</div>' +
      '</div>' +
      '<p class="stage-note">분류는 AI 제안이며, 요구사항 상세 화면 ⑤에서 검토자가 확정합니다. 제품 표준화 검토 후보는 같은 후보군에서 사람이 공통 기능으로 확정한 요구사항이 2건 이상일 때 표시합니다. PoC 사례 내 반복 여부를 기준으로 한 후보이며, 실제 제품 로드맵 반영에는 고객 빈도 · 가치 · 개발비 검토가 필요합니다.</p>' +
      footerNote();
    window.scrollTo({ top: 0 });
  }

  function kpi(label, val, sub) {
    return '<div class="kpi"><div class="k-label">' + esc(label) + '</div><div class="k-val">' + esc(String(val)) + '</div><div class="k-sub">' + esc(sub) + '</div></div>';
  }

  // ---------- AI RESULT EVALUATION ----------
  // Evaluation scope: AI-proposed missing items (누락 조건) only. AC are AI drafts verified separately.
  function evalData() {
    var e = { total: 0, decided: 0, adopt: 0, exclude: 0, reqTouched: 0, reqFull: 0, reqTotal: 0,
      basis: { S: { a: 0, x: 0, n: 0 }, I: { a: 0, x: 0, n: 0 } },
      route: { P: { a: 0, x: 0, n: 0 }, E: { a: 0, x: 0, n: 0 }, B: { a: 0, x: 0, n: 0 } },
      prio: { P0: { a: 0, x: 0, n: 0 }, P1: { a: 0, x: 0, n: 0 } },
      why: { dup: 0, scope: 0, design: 0, etc: 0, none: 0 }, whyByBasis: {} };
    DATA.cases.forEach(function (c) {
      c.requirements.forEach(function (r) {
        e.reqTotal++;
        var touched = false, all = true;
        (r.missing_items || []).forEach(function (it, i) {
          e.total++;
          var pr = e.prio[it.priority] || (e.prio[it.priority] = { a: 0, x: 0, n: 0 });
          pr.n++;
          var bs = r.basis && r.basis[i] ? r.basis[i] : null;
          if (bs) { e.basis[bs.type].n++; e.route[bs.route].n++; }
          var d = decision(r.id, 'mi', i);
          if (!d) { all = false; return; }
          touched = true; e.decided++;
          var f = d === 'adopt' ? 'a' : 'x';
          e[d]++; pr[f]++;
          if (bs) { e.basis[bs.type][f]++; e.route[bs.route][f]++; }
          if (d === 'exclude') {
            var w = review[r.id + '|mi|' + i + '|why'] || 'none';
            e.why[w]++;
            if (bs) { e.whyByBasis[bs.type] = e.whyByBasis[bs.type] || {}; e.whyByBasis[bs.type][w] = (e.whyByBasis[bs.type][w] || 0) + 1; }
          }
        });
        if (touched) e.reqTouched++;
        if (touched && all) e.reqFull++;
      });
    });
    return e;
  }

  function pct(a, n) { return n ? Math.round(a / n * 100) + '%' : '—'; }

  function stackRow(label, o) {
    var n = o.a + o.x;
    var wa = n ? o.a / n * 100 : 0, wx = n ? o.x / n * 100 : 0;
    return '<div class="bar-row"><span>' + label + '</span>' +
      '<span class="bar-track" role="img" aria-label="채택 ' + o.a + ', 제외 ' + o.x + '"><span class="bar-fill f-adopt" style="width:' + wa + '%"></span><span class="bar-fill f-exclude" style="width:' + wx + '%"></span></span>' +
      '<span class="bar-num">' + (n ? '채택 ' + pct(o.a, n) : '미검토') + '</span></div>';
  }

            '</div>' +

      '</div>' +
      '<div class="panel snap"><h3>검토 결과 내보내기 · 가져오기</h3>' +
        '<p class="section-sub">검토 결과는 이 브라우저에만 저장됩니다. 아래 내용을 복사해 두면 다른 브라우저에서 가져오거나, 페이지에 스냅샷으로 넣어 방문자에게 같은 집계를 보여줄 수 있습니다.</p>' +
        '<textarea id="snap-text" spellcheck="false" aria-label="검토 결과 JSON">' + esc(JSON.stringify(review)) + '</textarea>' +
        '<div class="row"><button class="btn" data-action="snap-copy">복사</button><button class="btn" data-action="snap-import">붙여넣은 내용 가져오기</button>' +
          '<button class="btn" data-action="snap-clear">전체 검토 초기화</button><span class="snap-msg" id="snap-msg"></span></div>' +
      '</div>' +
      footerNote();
    window.scrollTo({ top: 0 });
  }

  function footerNote() {
    return (
      '<footer class="page-note">법령 근거는 산업안전보건기준에 관한 규칙 중 로봇 관련 제222~224조를 Knowledge로 등록한 Dify Workflow에서 검색합니다. 개발 환경에서는 브라우저가 API Key 없이 로컬 서버(/api/review)를 거쳐 Workflow를 호출하도록 구성했고, 배포본은 대표 요구사항의 실제 조회 결과를 저장해 표시합니다. 요구사항 품질 분석은 LLM 기반 4단계 파이프라인(모호성 탐지 → 누락 조건 탐지 → 수정안 생성 → Acceptance Criteria 생성)으로 생성했습니다. 업무 분류, 항목 간 연결, 판단 근거 · 확인 경로, 공통 기능 · 설정 · 고객 특화 분류는 LLM이 1차 제안하고 검토·보정했으며, 모든 결과는 사람이 검토·확정하도록 설계했습니다. 확정되지 않은 기술 수치는 <code class="mono">[값]</code>으로 남기고 임의로 지어내지 않으며, LLM이 내놓는 임의 확률(%)은 신뢰도로 쓰지 않습니다. 검토 상태·결정값·채택 여부는 서버에 저장되지 않고 이 브라우저에만 남습니다.</footer>'
    );
  }

  // ---------- router ----------
  function render() {
    if (state.view === 'home') renderHome();
    else if (state.view === 'detail') renderDetail(state.caseId);
    else if (state.view === 'matrix') renderMatrix();
    else if (state.view === 'board') renderBoard();
    else if (state.view === 'eval') renderEval();
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    if (action === 'go-home') { state = { view: 'home', caseId: null }; render(); window.scrollTo({ top: 0 }); }
    else if (action === 'go-matrix') { state = { view: 'matrix', caseId: null }; render(); }
    else if (action === 'go-board') { ev.preventDefault(); state = { view: 'board', caseId: null }; render(); }
    else if (action === 'rag-query') { runRag(el.getAttribute('data-rid')); }
    else if (action === 'go-cases') { var ct = document.getElementById('cases'); if (ct) ct.scrollIntoView({ behavior: 'smooth' }); }
    else if (action === 'go-eval') { state = { view: 'eval', caseId: null }; render(); }
    else if (action === 'classify') {
      var ck = el.getAttribute('data-rid') + '|pc|' + el.getAttribute('data-idx');
      var cv = el.getAttribute('data-val');
      if (review[ck] === cv) delete review[ck]; else review[ck] = cv;
      saveReview(); rerenderReview(el.getAttribute('data-rid'));
    }
    else if (action === 'rag-copy') {
      var rt = document.getElementById('rag-text'); rt.select();
      var rm = document.getElementById('rag-msg');
      try {
        if (navigator.clipboard) navigator.clipboard.writeText(rt.value).then(function () { rm.textContent = '복사했습니다.'; }, function () { document.execCommand('copy'); rm.textContent = '복사했습니다.'; });
        else { document.execCommand('copy'); rm.textContent = '복사했습니다.'; }
      } catch (e) { rm.textContent = '선택된 내용을 직접 복사하세요.'; }
    }
    else if (action === 'snap-copy') {
      var ta = document.getElementById('snap-text'); ta.select();
      var msg = el.closest('.snap') ? document.getElementById('snap-msg') : document.getElementById('snap-msg-top');
      try {
        if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () { msg.textContent = '복사했습니다.'; }, function () { document.execCommand('copy'); msg.textContent = '복사했습니다.'; });
        else { document.execCommand('copy'); msg.textContent = '복사했습니다.'; }
      } catch (e) { msg.textContent = '선택된 내용을 직접 복사하세요.'; }
    }
    else if (action === 'snap-goto') {
      var sp = document.querySelector('.panel.snap'); if (sp) sp.scrollIntoView({ behavior: 'smooth' });
    }
    else if (action === 'snap-import') {
      var msg2 = document.getElementById('snap-msg');
      try {
        var obj = JSON.parse(document.getElementById('snap-text').value || '{}');
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('bad');
        review = obj; saveReview(); renderEval();
        document.getElementById('snap-msg').textContent = '가져왔습니다.';
      } catch (e) { msg2.style.color = 'var(--critical)'; msg2.textContent = 'JSON 형식이 올바르지 않습니다.'; }
    }
    else if (action === 'snap-clear') {
      if (el.getAttribute('data-armed') !== '1') {
        el.setAttribute('data-armed', '1'); el.textContent = '한 번 더 누르면 모든 검토가 지워집니다';
        return;
      }
      review = {}; saveReview(); renderEval();
      document.getElementById('snap-msg').textContent = '초기화했습니다.';
    }
    else if (action === 'open-case') {
      state = { view: 'detail', caseId: el.getAttribute('data-case-id') }; render();
      var focusId = el.getAttribute('data-req-id');
      var target = focusId && document.querySelector('.req-body[data-rid="' + focusId + '"]');
      if (target) {
        target.parentNode.open = true;
        target.parentNode.scrollIntoView();
      }
    }
    else if (action === 'decide') {
      var key = el.getAttribute('data-rid') + '|' + el.getAttribute('data-kind') + '|' + el.getAttribute('data-idx');
      var val = el.getAttribute('data-val');
      if (review[key] === val) delete review[key]; else review[key] = val;
      if (review[key] !== 'exclude') delete review[key + '|why'];
      saveReview(); rerenderReview(el.getAttribute('data-rid'));
    }
    else if (action === 'review-reset') {
      var rid = el.getAttribute('data-rid');
      Object.keys(review).forEach(function (k) { if (k.indexOf(rid + '|') === 0) delete review[k]; });
      saveReview(); rerenderReview(rid);
    }
  });

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.classList && el.classList.contains('why-select')) {
      var wk = el.getAttribute('data-rid') + '|' + el.getAttribute('data-kind') + '|' + el.getAttribute('data-idx') + '|why';
      if (el.value) review[wk] = el.value; else delete review[wk];
      saveReview(); rerenderReview(el.getAttribute('data-rid'));
      return;
    }
    if (!el.classList || !el.classList.contains('er-status')) return;
    var rid = el.getAttribute('data-rid');
    review[rid + '|er|' + el.getAttribute('data-er')] = el.value;
    saveReview(); rerenderReview(rid);
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (!el.classList || !el.classList.contains('ph-input')) return;
    var rid = el.getAttribute('data-rid');
    var key = rid + '|ph|' + el.getAttribute('data-ph');
    if (el.value.trim()) review[key] = el.value; else delete review[key];
    saveReview(); patchReview(rid);
  });

  render();
})();
</script>
